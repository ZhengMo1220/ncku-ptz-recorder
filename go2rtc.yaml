# go2rtc 本機 restream 設定
# 每台相機只被 go2rtc 連「一次」，再把同一條串流分流給 App 的「預覽 + 錄影」。
# 這樣相機不用同時推兩條 120fps 主流，錄影時開預覽較不會掉幀。
#
# 啟動：App 在 utils/stream_thread.py 的 USE_GO2RTC=True 時會自動跑
#       go2rtc.exe -config go2rtc.yaml（也可手動在終端機跑同一行）。
# 除錯：瀏覽器開 http://127.0.0.1:1984 可看每條 stream 狀態。
#
# 串流名稱必須對應程式裡的 camera_name；App 會連 rtsp://127.0.0.1:8554/<name>。
#   多機分頁：Ptz01~Ptz08。
#   單機分頁（camera_tab_control.py 的 camera_map）：另外還有 Rot01~Rot20、Sti01~Sti06。
# IP 對應：Rot01→10.30.3.1…Rot20→.20、Sti01→.21…Sti06→.26、Ptz01→.27…Ptz08→.34。

api:
  listen: "127.0.0.1:1984"     # go2rtc 網頁/API（僅本機，除錯用）

rtsp:
  listen: "127.0.0.1:8554"     # 本機 RTSP restream；App 連 rtsp://127.0.0.1:8554/<name>

streams:
  Rot01: rtsp://${PTZ_CAMERA_USER}:${PTZ_CAMERA_PASS}@10.30.3.1:554/stream0
